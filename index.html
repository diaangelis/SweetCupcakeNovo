
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SweetCupcake</title>
</head>
<link rel="stylesheet" href="style.css">

<body>


<header>
    <h1>🧁 SweetCupcake</h1>

    <p>Cupcakes artesanais feitos com carinho</p>

    <div class="categorias">
        <span>🍫 Chocolate</span>
        <span>🍓 Morango</span>
        <span>🍋 Limão</span>
    </div>
</header>

    <main>

        <h2>Os nossos cupcakes</h2>

        <section id="produtos">
</section>

<hr>

        

<h2>🛒 Carrinho</h2>

<div id="carrinho">
    <p>O seu carrinho está vazio.</p>
</div>

<p id="total">Total: 0,00 €</p>


<h3>📦 Dados para entrega</h3>

<label for="nome-cliente">
    Nome completo:
</label>

<input
    type="text"
    id="nome-cliente"
    placeholder="Nome completo"
>

<br><br>

<label for="telefone-cliente">
    Telefone:
</label>

<input
    type="tel"
    id="telefone-cliente"
    placeholder="912 345 678"
>

<br><br>

<label for="morada-cliente">
    Morada:
</label>

<input
    type="text"
    id="morada-cliente"
    placeholder="Rua e número"
>

<br><br>

<label for="codigo-postal">
    Código Postal:
</label>

<input
    type="text"
    id="codigo-postal"
    placeholder="1000-000"
>

<br><br>

<label for="cidade-cliente">
    Cidade:
</label>

<input
    type="text"
    id="cidade-cliente"
    placeholder="Lisboa"
>

<br><br>



<button onclick="finalizarCompra()">Finalizar compra</button>
<p id="mensagem"></p>





    </main>


<section id="area-vendedor">

    <h2>📦 Área do Vendedor</h2>

    <div id="pedidos-vendedor">
        <p>A carregar pedidos...</p>
    </div>

</section>



    <footer>
        <p>© 2026 SweetCupcake</p>
    </footer>

<script src="script.js"></script>


</body>
</html>
